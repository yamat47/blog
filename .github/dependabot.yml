# Policy: always follow the latest (including majors).
# GitHub Actions are out of scope because github-toolkit is referenced at @main.
# The skills in .claude/skills/ are also out of Dependabot's scope; the update-skills workflow plays the same role.
#  - minor / patch of development dependencies: one PR (less noise)
#  - major, and every bump of what the site is built with (astro): individual PRs, so a change that
#    can alter the pages is reviewed on its own
#  - astro and @astrojs/markdown-satteri: one PR. astro depends on an exact version of the
#    processor, and astro.config.ts builds the processor from the copy this repository declares,
#    so a bump of one alone would leave two versions installed
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Also raise the range specified in package.json itself to the latest (not just follow the lockfile)
    versioning-strategy: increase
    # Wait 7 days after publication before bumping. pnpm 11 does not install versions published less than
    # a day ago (minimumReleaseAge), so a PR arriving before that fails install. 7 days is the length zizmor
    # requires (dependabot-cooldown) to avoid the period right after publication, when withdrawals and
    # replacements are common
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/markdown-satteri"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # An exception to following majors: @astrojs/check accepts TypeScript 5 and 6 only
      # (its peerDependencies), and `astro check` is the typecheck. Remove this entry when a
      # release of @astrojs/check accepts TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Its major is the major of Node, so it is raised by hand in the pull request that bumps
      # Node (the docker entry below; docker/Dockerfile lists what else changes there). Types for
      # a newer Node would let code use what the runtime does not have.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # Base of the development image (node:<major>-<debian>-slim)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps-dev)
